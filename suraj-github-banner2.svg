<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F1B2E"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1E293B"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)" opacity="0.5"/>

  <rect x="0" y="0" width="6" height="280" fill="#2DD4BF"/>

  <text x="60" y="66" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14" letter-spacing="3" fill="#5EEAD4">&gt;_ BACKEND.SURAJ</text>

  <text x="58" y="118" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="42" font-weight="700" fill="#E5E7EB">SURAJ DAMBHARE</text>

  <text x="60" y="152" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="19" fill="#2DD4BF">Senior Java Backend Developer</text>

  <text x="60" y="180" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14" fill="#8B95A7" letter-spacing="1">Spring Boot &#183; Microservices &#183; AWS &#183; Wipro Technologies</text>

  <text x="60" y="222" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="15" fill="#94A3B8">
    <tspan fill="#5EEAD4">$</tspan> building an e-commerce platform &#183; learning system design &amp; DSA
  </text>
  <rect x="640" y="209" width="10" height="17" fill="#5EEAD4">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- service mesh graph -->
  <g stroke="#2DD4BF" stroke-width="1.4" opacity="0.55">
    <line x1="760" y1="150" x2="855" y2="82"/>
    <line x1="760" y1="150" x2="855" y2="212"/>
    <line x1="855" y1="82" x2="955" y2="110"/>
    <line x1="855" y1="212" x2="955" y2="185"/>
    <line x1="955" y1="110" x2="1075" y2="150" stroke-width="2.2" opacity="0.9"/>
    <line x1="955" y1="185" x2="1075" y2="150" stroke-width="2.2" opacity="0.9"/>
    <line x1="760" y1="150" x2="1075" y2="150" stroke-width="1" opacity="0.3" stroke-dasharray="3 4"/>
  </g>

  <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11.5" fill="#94A3B8" text-anchor="middle">
    <circle cx="760" cy="150" r="8" fill="#0F1B2E" stroke="#2DD4BF" stroke-width="2"/>
    <text x="760" y="177">gateway</text>

    <circle cx="855" cy="82" r="7" fill="#0F1B2E" stroke="#2DD4BF" stroke-width="2"/>
    <text x="855" y="65">auth-svc</text>

    <circle cx="855" cy="212" r="7" fill="#0F1B2E" stroke="#2DD4BF" stroke-width="2"/>
    <text x="855" y="238">user-svc</text>

    <circle cx="955" cy="110" r="7" fill="#0F1B2E" stroke="#2DD4BF" stroke-width="2"/>
    <text x="955" y="93">orders-svc</text>

    <circle cx="955" cy="185" r="7" fill="#0F1B2E" stroke="#2DD4BF" stroke-width="2"/>
    <text x="955" y="211">payments-svc</text>

    <circle cx="1075" cy="150" r="11" fill="#1a1408" stroke="#F5A623" stroke-width="2.4" filter="url(#glow)">
      <animate attributeName="r" values="11;14;11" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1075" y="180" fill="#F5A623" font-weight="700">ecommerce-svc</text>
  </g>
</svg>
