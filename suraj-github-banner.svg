<svg viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="55%" stop-color="#101623"/>
      <stop offset="100%" stop-color="#141B26"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6DB33F" stop-opacity="0"/>
      <stop offset="15%" stop-color="#6DB33F" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#E8A33D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6DB33F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6DB33F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6DB33F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect x="0" y="393" width="1584" height="3" fill="url(#rule)"/>

  <!-- ================= LEFT: identity ================= -->
  <text x="80" y="96" font-size="19" fill="#E8A33D" letter-spacing="0.5">$ whoami</text>

  <text x="80" y="176" font-size="60" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="700" fill="#EDEFF2" letter-spacing="-1">
    Suraj Dambhare
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0s" fill="freeze"/>
  </text>
  <rect x="562" y="132" width="14" height="46" fill="#6DB33F">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="80" y="216" font-size="25" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600" fill="#6DB33F">Java Backend Developer</text>

  <text x="80" y="256" font-size="16" fill="#7C8493" letter-spacing="0.3">Spring Boot · Hibernate · REST APIs · MySQL · MongoDB · AWS</text>

  <line x1="80" y1="284" x2="420" y2="284" stroke="#2A3242" stroke-width="1"/>

  <text x="80" y="316" font-size="16" fill="#9AA2B1">Pune, India</text>
  <circle cx="185" cy="311" r="2.5" fill="#4B5566"/>
  <text x="198" y="316" font-size="16" fill="#9AA2B1">4+ yrs experience</text>
  <circle cx="342" cy="311" r="2.5" fill="#4B5566"/>
  <text x="355" y="316" font-size="16" fill="#9AA2B1">building scalable systems</text>

  <text x="80" y="356" font-size="15" fill="#4B5566">github.com/surajDambhare</text>

  <!-- ================= RIGHT: microservices node-graph (signature) ================= -->
  <g>
    <!-- connecting traces -->
    <g stroke="#6DB33F" stroke-width="1.4" stroke-opacity="0.55">
      <line x1="1180" y1="198" x2="1180" y2="98"/>
      <line x1="1180" y1="198" x2="1310" y2="140"/>
      <line x1="1180" y1="198" x2="1310" y2="256"/>
      <line x1="1180" y1="198" x2="1180" y2="298"/>
      <line x1="1180" y1="198" x2="1050" y2="256"/>
      <line x1="1180" y1="198" x2="1050" y2="140"/>
    </g>

    <!-- hub -->
    <circle cx="1180" cy="198" r="70" fill="url(#hubGlow)"/>
    <circle cx="1180" cy="198" r="32" fill="#101623" stroke="#6DB33F" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1180" y="204" font-size="16" font-weight="700" fill="#EDEFF2" text-anchor="middle">SD</text>

    <!-- satellite nodes -->
    <g text-anchor="middle">
      <!-- Spring Boot -->
      <circle cx="1180" cy="98" r="26" fill="#101623" stroke="#6DB33F" stroke-width="1.5"/>
      <text x="1180" y="103" font-size="11" fill="#C9CED8">Spring</text>
      <text x="1180" y="140" font-size="12" fill="#7C8493">Spring Boot</text>

      <!-- AWS -->
      <circle cx="1310" cy="140" r="26" fill="#101623" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="1310" y="145" font-size="11" fill="#C9CED8">AWS</text>
      <text x="1310" y="182" font-size="12" fill="#7C8493">AWS</text>

      <!-- Docker -->
      <circle cx="1310" cy="256" r="26" fill="#101623" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="1310" y="261" font-size="11" fill="#C9CED8">Docker</text>
      <text x="1310" y="298" font-size="12" fill="#7C8493">Docker</text>

      <!-- Kafka -->
      <circle cx="1180" cy="298" r="26" fill="#101623" stroke="#6DB33F" stroke-width="1.5"/>
      <text x="1180" y="303" font-size="11" fill="#C9CED8">Kafka</text>
      <text x="1180" y="340" font-size="12" fill="#7C8493">Kafka</text>

      <!-- MongoDB -->
      <circle cx="1050" cy="256" r="26" fill="#101623" stroke="#E8A33D" stroke-width="1.5"/>
      <text x="1050" y="261" font-size="11" fill="#C9CED8">Mongo</text>
      <text x="1050" y="298" font-size="12" fill="#7C8493">MongoDB</text>

      <!-- MySQL -->
      <circle cx="1050" cy="140" r="26" fill="#101623" stroke="#6DB33F" stroke-width="1.5"/>
      <text x="1050" y="145" font-size="11" fill="#C9CED8">SQL</text>
      <text x="1050" y="182" font-size="12" fill="#7C8493">MySQL</text>
    </g>
  </g>
</svg>
